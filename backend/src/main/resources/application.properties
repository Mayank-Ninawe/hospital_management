# Server
server.port=${PORT:8080}

# Database (PostgreSQL example, works smoothly with Railway/Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Update to update/validate in production for safety, let it be update for local. 
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Security/JWT
app.jwt.secret=${JWT_SECRET:supersecretkeythatisatleast32characterslongforlocaldev}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
