# Server
server.port=${PORT:8080}

# Database (MySQL example, works smoothly with Clever Cloud/Render)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# Update to update/validate in production for safety, let it be update for local. 
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Security/JWT
app.jwt.secret=${JWT_SECRET:supersecretkeythatisatleast32characterslongforlocaldev}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
