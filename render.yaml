services:
  - type: web
    name: hms-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/public/health
    envVars:
      - key: PORT
        value: 8080
      - key: DDL_AUTO
        value: validate
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false